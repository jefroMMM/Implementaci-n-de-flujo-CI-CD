services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: cicd-vps-demo:latest
    container_name: cicd-vps-demo
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GIT_SHA: ${GIT_SHA:-local}
      PUBLIC_HOST: 20.49.8.87
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
